[build]
target = "aarch64-unknown-none-softfloat"

[unstable]
build-std          = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]  # memcpy/memset symbols

[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "target-cpu=cortex-a53",
    "-C", "panic=abort",
    "-C", "force-unwind-tables=no",
]
